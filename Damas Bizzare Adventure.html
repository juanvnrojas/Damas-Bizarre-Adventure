<head>

<style>
:root{--bg:#f4efe6;--fg:#222;--pn:#fff;--bd:#c9bfae;--mu:#666;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}
#stage{--s:min(56px,8.4vw);display:flex;flex-direction:column;align-items:center;padding:16px 8px 24px;min-height:100vh;filter:var(--f,none);transition:filter .4s}

#stage.gold{--f:sepia(1) saturate(4) hue-rotate(-15deg)}#stage.red{--f:sepia(1) saturate(5) hue-rotate(-50deg)}
#stage.blue{--f:sepia(1) saturate(4) hue-rotate(150deg)}#stage.green{--f:sepia(1) saturate(4) hue-rotate(60deg)}

h1{margin:0 0 6px;font-size:22px}
#stt{min-height:40px;max-width:620px;text-align:center;font-weight:700;font-size:15px;margin:4px 0 8px}
#bw{position:relative;width:calc(var(--s)*10);height:calc(var(--s)*10);box-shadow:0 0 0 4px #000,0 8px 30px #000a;border-radius:2px}

<script>

[27,'Matte Kudasai — Réplica de Desejo','Cria clone temporário de 1 peça por 3 turnos na retaguarda.','steel','#cfd8dc'],
[28,'Man in the Mirror — Mundo Espelhado','Só neste turno: o tabuleiro vira cilíndrico (laterais se conectam).','dark','#bcaaa4'],

[30,'Kars — Forma de Vida Definitiva','No início, copie definitivamente qualquer Stand do jogo.','gold','#ffb300']

const CDT=[10,8,4,0,12,4,0,6,10,6,12,8,14,4,2,10,0,6,10,6,4,6,6,6,6,6,6,4,6,0];
const PAS=[3,4,17],REA=[2,5,11,8,16,29],PRE=[8,16],SB=id=>ST[id-1],H=s=>s==='w'||M.p2;
let S,P,G,L=[],sel=null,tg=null,busy=0,turn='w',over=0,last=[],gh=[],turnN=0,ALLY=0,T=1,gid=0,M={p2:0,sw:0,sb:0};
let AIP=[],AIA=0,CUR=0;

const wrap=x=>S.cyl?((x%10)+10)%10:x;
const ok=(y,x)=>y>=0&&y<10&&(S.cyl||(x>=0&&x<10));
const pc=n=>{const y=n/10|0,x=wrap(n%10); return (y>=0&&y<10&&x>=0&&x<10)?G[y][x]:null;};
const ownP=m=>n=>{const p=pc(n);return !!p&&p.s===m},enP=m=>n=>{const p=pc(n);return !!p&&p.s!==m};
const dg=(a,b)=>{const ya=a/10|0,xa=wrap(a%10),yb=b/10|0,xb=wrap(b%10); return (ya*10+xa)!==(yb*10+xb) && Math.abs(ya-yb)===Math.abs(xa-xb)};

for(let n=0;n<100;n++){const e=document.createElement('div');e.className='cell '+(dk(n)?'d':'l');e.onclick=()=>click(n);board.appendChild(e)}

const imm=c=>S.ex[c]||S.tw[c],stuck=p=>(p.trap||p.tng)&&!imm(p.s),exempt=c=>has(c,4)||S.free[c]||S.ex[c]||S.tw[c];
const dirh=(a,b)=>{const dy=b[0]-a[0],dx=b[1]-a[1];return[sg(dy),Math.abs(dx)===Math.abs(dy)?sg(dx):-sg(dx)]};
const ek=p=>p.k||S.mih[p.s],fr=(y,x,p)=>!G[y][wrap(x)]||G[y][wrap(x)]===p;

function seq(p,r,c,tk,path,out,dd=0){
  let f=0;const k=ek(p);
  for(const[dr,dc]of D){
    let y=r+dr,x=c+dc;
    if(k)while(ok(y,x)&&fr(y,x,p)){y+=dr;x+=dc}
    if(!ok(y,x))continue;
    const q=G[y][wrap(x)];
    if(!q||q===p||tk.includes(q)||(ALLY?q.s!==p.s:q.s===p.s))continue;
    if(q.trap&&!imm(p.s)){f=1;out.push({path:[...path,[y,wrap(x),dr,dc]],tk:[...tk,q]});continue}

    if(!ok(ly,lx))continue;
    if(fr(ly,lx,p)){
      const lnd=(a,b)=>{f=1;if(S.trapSq===a*10+wrap(b)&&!imm(p.s))out.push({path:[...path,[a,wrap(b),dr,dc]],tk:[...tk,q]});else seq(p,a,wrap(b),[...tk,q],[...path,[a,wrap(b),dr,dc]],out,dd)};lnd(ly,lx);
      if(k)while(ok(ly+dr,lx+dc)&&fr(ly+dr,lx+dc,p)){ly+=dr;lx+=dc;lnd(ly,lx);}
    }else if(has(p.s,22) && !dd && !ALLY){ 
      const q2=G[ly][wrap(lx)];
      if(q2 && q2.s!==p.s && !tk.includes(q2) && !q2.trap){
        let lly=ly+dr,llx=lx+dc;
        if(ok(lly,llx)&&fr(lly,llx,p)){

        }
      }
    }
  }

}
function capsOf(p){const o=[];seq(p,p.r,p.c,[],[[p.r,p.c]],o);return o.map(x=>({p,path:x.path,to:x.path[x.path.length-1].slice(0,2),taken:x.tk}))}
function harv(p){
  const mp=new Map(),add=m=>{const k=m.to+'|'+m.taken.length,o=mp.get(k);if(!o||o.path.length>m.path.length)mp.set(k,m)};
  (function go(r,c,dp,path){
    if(dp>0)add({p,path,to:[r,c],taken:[]});
    if(dp>0&&dp<3){const o=[];seq(p,r,c,[],[...path],o);o.forEach(x=>{if(x.tk.length)add({p,path:x.path,to:x.path[x.path.length-1].slice(0,2),taken:x.tk})})}
    if(dp===3)return;
    for(const[dr,dc]of D){const y=r+dr,x=wrap(c+dc);if(ok(y,x)&&fr(y,x,p))go(y,x,dp+1,[...path,[y,x]])}
  })(p.r,p.c,0,[[p.r,p.c]]);
  return[...mp.values()];
}
function simple(p){
  const o=[],k=ek(p),isH=sid(p.s)===20&&!p.k&&P.filter(q=>q.alive&&!q.hide&&q.s===p.s).length===1;
  if(isH){o.push(...harv(p));
  }else{
    for(const[dr,dc]of D){
      if(!k&&dr!==(p.s==='w'?-1:1))continue;
      let y=p.r+dr,x=p.c+dc;
      while(ok(y,x)&&!G[y][wrap(x)]){o.push({p,path:[[p.r,p.c],[y,wrap(x)]],to:[y,wrap(x)],taken:[]});if(!k)break;y+=dr;x+=dc}
    }
  }
  return o;
}
function fmoves(p){if(stuck(p)||p.hide)return[];ALLY=1;const a=capsOf(p);ALLY=0;if(a.length)return a;return[...capsOf(p),...(p.trap?[]:simple(p))]}
function legal(c){
  const f=S.forced[c];
  if(f){
    if(f.alive && !stuck(f) && !f.hide){
      const m=fmoves(f);
      if(m.length) return m;
    }
    S.forced[c]=null;
  }
  const ps = P.filter(p=>p.alive && p.s===c && !stuck(p) && !p.hide);
  let cp=ps.reduce((acc, p)=>acc.concat(capsOf(p)), []);
  const mx=Math.max(0,...cp.map(m=>m.taken.length));
  if(!exempt(c))cp=cp.filter(m=>m.taken.length===mx);
  const sm=ps.reduce((acc, p)=>acc.concat(simple(p)), []);
  return cp.length && !exempt(c) ? cp : [...cp, ...sm];
}
function sim(m,f){
  const p=m.p,o=[p.r,p.c,p.k];G[p.r][p.c]=null;m.taken.forEach(q=>{G[q.r][q.c]=null;q.alive=0});
  [p.r,p.c]=m.to;G[p.r][p.c]=p;if(p.r===(p.s==='w'?0:9))p.k=1;
  const v=f();G[p.r][p.c]=null;[p.r,p.c,p.k]=o;G[p.r][p.c]=p;m.taken.forEach(q=>{q.alive=1;G[q.r][q.c]=q});return v;
}
const VAL=q=>q.k?2.2:1,idx=p=>p.r*10+p.c,own=c=>P.filter(p=>p.alive&&!p.hide&&p.s===c),foes=c=>P.filter(p=>p.alive&&!p.hide&&p.s!==c),shuf=a=>a.sort(()=>Math.random()-.5);
const cval=x=>3*x.taken.reduce((a,q)=>a+(q.s===x.p.s?-1:1)*VAL(q),0);
const lg=c=>{const f={...S.forced},m=legal(c);S.forced=f;return m};
const matv=c=>3*P.reduce((a,q)=>a+(q.alive?(q.s===c?1:-1)*VAL(q):0),0);
const capv=c=>{const ms=lg(c);return ms.length?Math.max(0,...ms.map(cval)):-9};
const tscore=c=>matv(c)+capv(c)-capv(opp(c));
const bombFx=x=>x.taken.reduce((a,q)=>{if(!q.bomb)return a;let v=-3*VAL(x.p);if(q.bomb===2)for(const[da,db]of D){const z=ok(q.r+da,wrap(q.c+db))&&G[q.r+da][wrap(q.c+db)];if(z&&z!==x.p)v-=(z.s===x.p.s?3:-3)*VAL(z)}return a+v},0);
function replyVal(en){
  const ms=lg(en);if(!ms.length)return -6;
  const cs=ms.filter(x=>x.taken.length);if(!cs.length)return 0;
  const ex=exempt(en),vs=cs.map(x=>({n:x.taken.length,v:cval(x)+bombFx(x)})),k=y=>ex?y.v:y.n,mx=Math.max(...vs.map(k)),c=vs.filter(y=>k(y)===mx);
  return c.reduce((a,y)=>a+y.v,0)/c.length;

async function chkImmunity(m,q,base){
  if(!q)return false;

  if(rdy(o,5)&&await want(o,'Gold Experience Requiem: anular esta habilidade inimiga?',GERP[CUR]??.7)){await sc(o,5);cd(o,5);return true;}

    await sc(o,11);cd(o,11);
    let minDist = Infinity;
    let candidates = [];
    P.forEach(p=>{
      if(p.alive && !p.hide && p.s===m){
        let d = Math.abs(p.r-q.r) + Math.abs(p.c-q.c);
        if(d < minDist){ minDist = d; candidates = [p]; }
        else if(d === minDist){ candidates.push(p); }

    if(base&&base.alive&&!base.hide&&base.s===m)candidates=[base];
    if(candidates.length === 1){
      const b = candidates[0];
      burst(b.r, b.c, 'big');
      kill(b, false);
    } else if(candidates.length > 1){
      if(H(o)){
        const target = await ch(o, 'Wonder of U: escolha qual peça inimiga será destruída.', n => candidates.some(p => p.r*10 + p.c === n));
        if(target != null){
          const b = candidates.find(p => p.r*10 + p.c === target);
          burst(b.r, b.c, 'big');
          kill(b, false);
        }
      } else {
        const b = rnd(candidates);
        burst(b.r, b.c, 'big');
        kill(b, false);
      }
    }
    return true;
  }
  return false;
}

  return new Promise(r=>{const s=$('selk');$('aq').textContent=q;s.innerHTML=opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('');s.hidden=false;$('an').hidden=true;$('ay').textContent='Confirmar';ask.hidden=false;

async function initStandsDynamically(s, isWs=false){
  let stObj = isWs ? S.ws_st[s] : S.st[s];
  if (!stObj) return;
  if (stObj.id === 30) {
    if(H(s)){
      $('aq').textContent='Kars: Escolha o Stand para copiar';
      $('selk').innerHTML=ST.filter(x=>x.id<30).map(x=>`<option value="${x.id}">${x.id} - ${x.name.split(' ')[0]}</option>`).join('');
      $('selk').hidden=false;ask.hidden=false;$('ay').textContent='Copiar';$('an').hidden=true;
      await new Promise(r=>{$('ay').onclick=()=>{ask.hidden=true;$('selk').hidden=true;$('an').hidden=false;$('ay').textContent='Usar';
        if(isWs) S.ws_st[s]=SB(+$('selk').value); else S.st[s]=SB(+$('selk').value); r();
      };});
    }else {
      if(isWs) S.ws_st[s]=rnd(ST.filter(x=>x.id<30)); else S.st[s]=rnd(ST.filter(x=>x.id<30));
    }
    status();
  }
  stObj = isWs ? S.ws_st[s] : S.st[s];
  if (stObj.id === 17 && !P.some(p=>p.alive && p.para)) {
    if(H(s)){const a=await ch(s,'Cheap Trick: escolha INIMIGO para infectar inicialmente.',n=>enP(s)(n),false);if(a!=null)pc(a).para=1;}
    else rnd(P.filter(p=>p.alive&&p.s!==s)).para=1;
    sync();
  }
}

async function retPres(p){
  p.hide=0;let[y,x]=p.orig;
  if(G[y][x]){
    const o=G[y][x];let bs=null,bd=99;
    for(let r=0;r<10;r++)for(let c=0;c<10;c++)if((r+c)%2===1&&!G[r][c]){
      const d=Math.max(Math.abs(r-y),Math.abs(c-x));if(d<bd){bd=d;bs=r*10+c}
    }
    if(bs!=null)await put(o,bs);else kill(o,false);
  }
  await put(p,y*10+x);sync();
}

const ctSide=()=>['w','b'].find(c=>has(c,17));
const ctBack=c=>{const br=c.r+(c.s==='w'?1:-1);return[-1,1].map(d=>ok(br,wrap(c.c+d))?G[br][wrap(c.c+d)]:null).filter(x=>x&&x.alive&&!x.hide)};
async function ctKill(h,heir){
  const cs=ctSide();
  if(cs&&h.s!==cs&&await chkImmunity(cs,h))return;
  burst(h.r,h.c,'big');h.para=0;kill(h,false);S.ct_dead=null;heir.para=1;sync();

async function ctMove(p){
  if(!p.alive||p.hide||imm(p.s))return;
  if(p.para){const b=ctBack(p);if(b.length)await ctKill(p,b.find(x=>x.s!==p.s)||b[0]);return}
  const h=P.find(q=>q.alive&&q.para&&!q.hide);
  if(h&&ctBack(h).includes(p))await ctKill(h,p);
}
async function epi(q,p,m){
  const o=q.s;if(!rdy(o,4)||q.hide||!q.alive||imm(p.s)||stuck(q))return 0;
  const cs=D.map(([a,b])=>[q.r+a,wrap(q.c+b)]).filter(([y,x])=>ok(y,x)&&!G[y][x]).map(([y,x])=>y*10+x);
  if(!cs.length||!await want(o,'King Crimson — Epitaph: antecipar o golpe e mover a peça ameaçada 1 casa?',(m&&m.taken.length>1)||q.k?1:.6))return 0;
  if(await gerCtr(p.s,'o Epitaph')){cd(o,4,6);return 0}
  const n=await ch(o,'Epitaph: escolha a casa vaga para onde a peça foge.',x=>cs.includes(x));if(n==null)return 0;
  await sc(o,4);cd(o,4,6);
  
  await put(q,n);
  sync();
  return 1;
}

async function triggerDelayedBombs() {
    if (!S.pending_bombs || !S.pending_bombs.length) return;
    for (const b of S.pending_bombs) {
        const p = b.captor;
        if (!p.alive) continue;
        burst(p.r, p.c, 'big'); shake(); kill(p, true);
        if (b.type === 2) {
            for(const[da,db]of D){
                const a = p.r+da, c = wrap(p.c+db);
                const z = ok(a,c) && G[a][c];
                if (z && z!==p) { burst(z.r, z.c, 'big'); kill(z, true); }
            }
        }
        sync();
        if(has(b.owner, 3)) cd(b.owner, 3, b.type===2?6:4);
        await sc(b.owner, 3, 900);
    }
    S.pending_bombs = [];
}

async function play(m){
  const p=m.p,tk=[],info={tk,promo:0,expl:0};
  if(S.fric[turn]){
    const lp=m.path[m.path.length-1];let[dr,dc]=lp.length>2?[lp[2],lp[3]]:dirh(m.path[m.path.length-2]||m.path[0],lp);
    if(dr||dc){let cy=m.to[0],cx=m.to[1];while(ok(cy+dr,cx+dc)&&!G[cy+dr][wrap(cx+dc)]){cy+=dr;cx+=dc}m.to=[cy,wrap(cx)];if(!ok(cy+dr,cx+dc))m.die=1;}S.fric[turn]=0;
  }
  let stop=0;
  for(let i=1;i<m.path.length&&!stop;i++){
    const[y,x,hr,hc]=m.path[i],[y0,x0]=[p.r,p.c],[dr,dc]=hr!==undefined?[hr,hc]:dirh([y0,x0],[y,x]),vs=[];
    for(let yy=y0+dr,xx=x0+dc;;yy+=dr,xx+=dc){const q=G[yy][wrap(xx)];if(q&&q!==p&&m.taken.includes(q))vs.push(q);if(yy===y)break}
    G[p.r][p.c]=null;p.r=y;p.c=wrap(x);G[y][p.c]=p;hop(p,Math.abs(x-x0)!==Math.abs(y-y0));
    await sleep(m.taken.length?340:260);
    for(const q of vs){
      const ep = await epi(q,p,m);
      if(ep){
          m.to=[p.r,p.c];
          stop=1; break;
      }
      const wp=q.para;q.para=0;tk.push(q);burst(q.r,q.c);kill(q,true);
      if(wp){if(imm(p.s))S.ct_dead=ctSide();else p.para=1}
      if(q.bomb){
        if(imm(p.s)){
            S.pending_bombs.push({captor: p, type: q.bomb, owner: q.s, bx: q.r, by: q.c});
            q.bomb = 0;
        } else {
            const bx=q.r,by=q.c;burst(p.r,p.c,'big');shake();kill(p,true);
            if(q.bomb===2)for(const[a,b]of D){const z=ok(bx+a,wrap(by+b))&&G[bx+a][wrap(by+b)];if(z&&z!==p){burst(z.r,z.c,'big');kill(z,true)}}
            sync();info.expl=1;if(has(q.s,3))cd(q.s,3,q.bomb===2?6:4);await sc(q.s,3,900);return info;
        }
      }
      if(q.trap&&!imm(p.s)){p.trap=1;sync();await sleep(200);stop=1;break}
    }
    if(vs.length&&!stop){sync();await sleep(180)}
  }
  if(!p.alive)return info;
  if(p.r!==m.to[0]||p.c!==m.to[1]){
    G[p.r][p.c]=null;p.r=m.to[0];p.c=m.to[1];if(!m.die)G[p.r][p.c]=p;hop(p);await sleep(260);
  }
  if(m.die){burst(p.r,p.c,'big');kill(p,true);return info;}
  if(!p.k&&p.r===(p.s==='w'?0:9)){p.k=1;info.promo=1;burst(p.r,p.c);burst(p.r,p.c,'big')}
  await land(p);if(!imm(p.s)&&tk.some(q=>q.trap))p.trap=1;await ctMove(p);
  if(tk.length>1){shake();combo(tk.length)}
  sync();return info;
}

  S.skip=ss.skip;S.ex=ss.ex;S.free=ss.free;S.pending_bombs=ss.pending_bombs||[];S.forced={w:null,b:null};sync();paint();

function restore(a){P.forEach((p,i)=>{if(!a[i])return;[p.alive,p.r,p.c,p.k,p.bomb,p.para,p.trap,p.hide]=a[i];p.bx=0});G.forEach(r=>r.fill(null));P.forEach(p=>{if(p.alive&&!p.hide)G[p.r][p.c]=p});sync()}
const snap=()=>P.map(p=>[p.alive,p.r,p.c,p.k,p.bomb,p.para,p.trap,p.hide]);

async function cdRev(c,pre,opp){
  if(!rdy(c,2))return;
  const dd=P.filter((p,i)=>p.s===c&&!p.clone&&pre[i]&&pre[i][0]&&!p.alive),q=dd.find(x=>x.k)||dd[0];
  if(!q||!await want(c,'Crazy Diamond: restaurar a peça destruída?',1))return;
  if(opp&&await gerCtr(opp,'a Restauração do Crazy Diamond')){cd(c,2);return}
  const cells=behindCells(c,q);if(!cells.length)return;
  const n=H(c)?await ch(c,'Crazy Diamond: escolha a casa vaga (atrás da sua peça mais avançada).',x=>cells.includes(x)):aiCell(c,cells,q);if(n==null)return;
  await sc(c,2);cd(c,2);q.alive=1;q.hide=0;q.bomb=0;q.bx=0;q.trap=0;q.tng=0;q.r=n/10|0;q.c=n%10;G[q.r][q.c]=q;sync();burst(q.r,q.c);await land(q);
}
async function react(o,m,pre,info,ua){
  const s=opp(o);
  if(!info.ts){await cdRev(s,pre,o);await cdRev(o,pre,s)}
  if(rdy(o,11)&&info.tk.length){
    if(!await want(o,'Wonder of U: anular e destruir agressor?',.9))return 0;
    if(await gerCtr(s,'a Calamidade do Wonder of U')){cd(o,11);return 0}
    await sc(o,11);Object.assign(S.used,ua||{});cd(o,11);restore(pre);burst(m.p.r,m.p.c,'big');kill(m.p, false);sync();return 1}
  if(rdy(o,5)&&!info.stand){
    if(!await want(o,'GER: anular ação inteira do oponente?',info.tk.length||info.promo?.95:.05))return 0;
    await sc(o,5);Object.assign(S.used,ua||{});cd(o,5);S.free[o]=1;restore(pre);return 1}
  return 0;
}
async function exec(m){const g0=gid;if(stuck(m.p)||m.p.hide)return;
  busy=1;tg=null;const hadCap=L.some(x=>x.taken.length);L=[];sel=null;
  const s=m.p.s,o=opp(s),pre=snap(),ua={...S.used},ts=imm(s);status();
  if(has(s,4)&&!m.taken.length&&hadCap)await sc(s,4,900);
  const info=await play(m);info.ts=ts;if(g0!==gid)return;
  last=[m.path[0][0]*10+wrap(m.path[0][1]),m.to[0]*10+wrap(m.to[1])];S.forced[s]=null;S.mih[s]=0;S.free[s]=0;
  if(S.tw[s]){S.tw[s]=0;if(!S.ex[s]) { fz(0); await triggerDelayedBombs(); } }
  sync();paint();
  turnN++;
  if(!over&&await react(o,m,pre,info,ua)){S.ex[s]=0;fz(0);await triggerDelayedBombs();return next(s,1)}
  await next(s);
}
async function next(s,f){P.forEach(p=>{if(p.s===s&&p.tng===1)p.tng=0});
  S.mih[s]=0;
  S.free[s]=0;
  const o=opp(s);let nx=o;
  let ts_ended = false;
  if(!f){
      if(S.ex[s]===1){S.ex[s]=2;nx=s}
      else if(S.ex[s]===2){S.ex[s]=0;fz(0);ts_ended=true;}
  }
  if(S.tw[s]){
      S.tw[s]=0;
      if(!S.ex[s]){ fz(0); ts_ended=true; }
  }
  if(nx===o){T++;S.cyl=0;}
  if(ts_ended) await triggerDelayedBombs();
  return checkPassivesAndBegin(nx,nx===o);
}
async function armBomb(s){
  if(!rdy(s,3)||P.some(p=>p.alive&&p.s===s&&p.bomb))return;
  const a=P.filter(p=>p.alive&&!p.hide&&p.s===s);if(!a.length)return;
  if(!H(s)){const en=opp(s),nb=p=>D.map(([x,y])=>ok(p.r+x,p.c+y)&&G[p.r+x][wrap(p.c+y)]).filter(z=>z&&z!==p),b=a.map(p=>[nb(p).filter(z=>z.s===en).length*1.2+(s==='b'?p.r:9-p.r)*.2-(p.k?2:0)+Math.random()*.6,p]).sort((x,y)=>y[0]-x[0])[0][1];
    b.bomb=nb(b).filter(z=>z.s===en).length>nb(b).filter(z=>z.s===s).length?2:1;sync();return}
  const n=await ch(s,'Killer Queen: escolha EM SEGREDO a peça que levará a bomba.',ownP(s));
  const t=await pickOpt(s,'Killer Queen: qual bomba?',[['1','Primeira Bomba (recarga 4)'],['2','Sheer Heart Attack (recarga 6 · explode as 4 diagonais)']]);
  (n!=null?pc(n):rnd(a)).bomb=+t;sync();
}
async function checkPassivesAndBegin(who,real){
  if(S.ct_dead&&S.ct_dead===who){
    const s=S.ct_dead;S.ct_dead=null;
    if(!P.some(p=>p.alive&&p.para)){
      if(H(s)){const a=await ch(s,'Cheap Trick: o hospedeiro morreu! Escolha uma nova peça para infectar.',n=>{const p=pc(n);return !!p&&!p.hide});if(a!=null)pc(a).para=1}
      else{const f=P.filter(p=>p.alive&&!p.hide&&p.s!==s);if(f.length)rnd(f).para=1}
      sync();
    }
  }
  return begin(who,real);
}

async function runStand(me){
  const pre=snap(),ss={ex:{...S.ex},mih:{...S.mih},st:{...S.st},ws_st:{...S.ws_st},used:{...S.used},ws_used:{...S.ws_used},forced:{...S.forced},trapSq:S.trapSq,mn:{...S.mn},free:{...S.free}, pending_bombs:S.pending_bombs},o=opp(me),id=sid(me);
  CUR=id;const m0=matv(o);const r=await useStand(me);
  if(!r||over)return r;
  if(r===5)return 5;
  if(rdy(o,5)&&await want(o,'GER: anular Stand oponente?',matv(o)-m0<=-2.5?1:(GERP[id]??.5))){
    await sc(o,5);Object.assign(S,ss);restore(pre);fz(0);cd(me,id);cd(o,5);S.free[o]=1;return 4}
  await react(o,null,pre,{tk:[],promo:0,stand:1,ts:imm(me)});
  return r;
}
function finish(loser){
  over=1;busy=1;L=[];ov.style.setProperty('--ac',loser==='b'?'#ffd54f':'#ff5252');
  ov.innerHTML=`<b>${M.p2?(loser==='b'?'🏆 BRANCAS VENCERAM':'🏆 PRETAS VENCERAM'):loser==='b'?'🏆 VOCÊ VENCEU!':'💀 A IA VENCEU'}</b><i>Clique em Novo Jogo</i>`;ov.className='on';stt.textContent='Fim de jogo.';btn();
}
async function begin(who,real){
  turn=who;busy=1;sel=null;L=[];
  if(real){
    if(real!==2)for(const k of['used','ws_used'])S[k][who]=Math.max(0,S[k][who]-1);
    await armBomb(who);
    S[`md_${who}`]=snap_full();
    for (const p of P.filter(p=>p.s===who)) {
      if(p.tng===2)p.tng=1;
      if(p.clone){p.clone--;if(p.clone===0)kill(p,true);}
      if(p.hide){p.hide--;if(p.hide===0){
        await retPres(p);
        if(p.hide_by){
          const hb=p.hide_by;
          if(S.st[hb].id===26)S.used[hb]=CDT[25];
          else if(S.ws_st[hb]&&S.ws_st[hb].id===26)S.ws_used[hb]=CDT[25];
          p.hide_by=null;
        }
      }}
    }
  }
  status();
  if(real&&!over&&!S.skip[who]){
    const o=opp(who);
    if(rdy(o,29) && S[`md_${o}`] && (H(o) ? await want(o, 'Mandom: rebobinar para o início do seu turno anterior?') : aiMandom(o,who))){
      await sc(o,29);
      if(rdy(who,5)&&(H(who)?await want(who,'GER: anular o Mandom (Retorno ao Zero)?'):Math.random()<.85)){
        await sc(who,5);cd(o,29,6);cd(who,5);S.free[who]=1;
      }else{restore_full(S[`md_${o}`]);cd(o,29,6);return begin(o,2)}
    }
    const id=PRE.find(i=>rdy(o,i));
    if(id&&(H(o)?await want(o,id===16?'The World: pular o turno inimigo?':'Heaven’s Door: comandar peça inimiga?'):aiPre(o,who,id))){
      if(id===16){await sc(o,16,1500);cd(o,16);fz(1);S.tw[o]=1;S.free[o]=1;return next(who,1)}
      const a=await ch(o,'Heaven’s Door: escolha peça alvo.',n=>{const p=pc(n);return !!p&&p.s===who&&fmoves(p).length>0});AIA=0;AIP.length=0;
      if(a!=null){await sc(o,8);S.forced[who]=pc(a);cd(o,8);sync()}
    }
  }
  if(S.skip[who]){S.skip[who]=0;return next(who,1);}
  busy=0;L=legal(who).filter(m=>!stuck(m.p)&&!m.p.hide);sync();
  if(!L.length&&P.some(p=>p.alive&&p.s===who&&p.tng)){stt.textContent='Peças emaranhadas — turno perdido.';await sleep(900);return next(who,1)}
  if(!P.some(p=>p.alive&&p.s===who)||!L.length)return finish(who);
  status();paint();if(!H(who))aiTurn();
}
async function aiTurn(){
  const g=gid,me=turn;busy=1;status();await sleep(550);if(g!==gid)return;
  if(turnN>1){
    const o=aiStandPick(me);
    if(o){AIP.length=0;AIP.push(...o.plan);AIA=1;S.ws_act=o.w?me:0;const r=await runStand(me);AIA=0;AIP.length=0;S.ws_act=0;if(over||g!==gid)return;if(r===5)return begin(me,false);if(r===3||r===4)return await next(me);L=legal(me);if(!L.length)return begin(me,false)}
  }
  exec(aiPick(L));
}
function click(n){
  if(tg){if(tg.f(n)){const t=tg;tg=null;cb.hidden=true;paint();t.res(n)}return}
  if(busy||!H(turn)||over)return;
  const m=L.find(x=>x.p===sel&&x.to[0]*10+wrap(x.to[1])===n);if(m)return exec(m);
  const p=pc(n);sel=p&&p.s===turn&&L.some(x=>x.p===p)?p:null;paint();
}
ub.onclick=async()=>{
  if(busy||!H(turn)||over||S.used[turn])return;
  const me=turn;busy=1;L=[];sel=null;status();S.ws_act=0;const r=await runStand(me);S.ws_act=0;busy=0;if(over)return;if(r===5)return begin(me,false);if(r===3||r===4)return await next(me);begin(me,false);
};
ub2.onclick=async()=>{
  if(busy||!H(turn)||over||S.ws_used[turn])return;
  const me=turn;busy=1;L=[];sel=null;status();S.ws_act=me;const r=await runStand(me);S.ws_act=0;busy=0;if(over)return;if(r===5)return begin(me,false);if(r===3||r===4)return await next(me);begin(me,false);
}

async function initGame(){gid++;
  P=[];G=Array.from({length:10},()=>Array(10).fill(null));pl.innerHTML='';
  S={st:{},ws_st:{w:0,b:0},used:{w:0,b:0},ws_used:{w:0,b:0},mih:{w:0,b:0},skip:{w:0,b:0},ex:{w:0,b:0},free:{w:0,b:0},mn:{w:0,b:0},forced:{w:null,b:null},fric:{w:0,b:0},trapSq:null,trapOwner:null,cyl:0,ws_act:0,ct_dead:null,tw:{w:0,b:0},sf:{w:0,b:0},pending_bombs:[]};
  for(let r=0;r<10;r++)for(let c=0;c<10;c++)if((r+c)%2===1&&(r<4||r>5)){
    const s=r<4?'b':'w',p={s,k:0,r,c,alive:1,bomb:0,para:0,trap:0,hide:0,hide_by:null,tng:0,clone:0,orig:null,el:mkEl(s)};P.push(p);G[r][c]=p;
  }
  const pool=[...ST].sort(()=>Math.random()-.5),pk=(v,i)=>v?SB(v):pool[i];
  const sa=pk(M.sw,0);let sb=pk(M.sb,1);if(sb===sa&&!(M.sw&&M.sb))sb=pool.find(s=>s!==sa);S.st.w=sa;S.st.b=sb;
  
  for(let s of['w','b']){

  $('l1').textContent=M.p2?'BRANCAS':'SEU STAND';$('l2').textContent=M.p2?'PRETAS':'STAND DA IA';sync();begin('w',1);
}
